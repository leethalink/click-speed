<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Speed</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <button class="skip-button" id="skipButton">Skip Ad</button>

  <div class="overlay" id="gameOverlay">
    <div class="panel" id="panel">
      <div class="captcha-header">
        <div class="captcha-icon bot" id="botIcon">
          <div class="icon-chip">
            <svg viewBox="0 0 64 64" class="icon-svg" aria-hidden="true">
              <rect x="16" y="18" width="32" height="24" rx="6" fill="#9ca3af"></rect>
              <rect x="22" y="24" width="7" height="7" rx="1.5" fill="#111827"></rect>
              <rect x="35" y="24" width="7" height="7" rx="1.5" fill="#111827"></rect>
              <rect x="25" y="35" width="14" height="3" rx="1.5" fill="#111827"></rect>
              <rect x="30" y="10" width="4" height="8" rx="2" fill="#9ca3af"></rect>
              <circle cx="32" cy="8" r="3" fill="#d1d5db"></circle>
              <rect x="12" y="24" width="4" height="10" rx="2" fill="#9ca3af"></rect>
              <rect x="48" y="24" width="4" height="10" rx="2" fill="#9ca3af"></rect>
            </svg>
          </div>
          <div class="icon-label">BOT</div>
        </div>

        <div class="captcha-center">
          <h1>Human Click Verification</h1>
          <div class="status-text" id="statusText">Click naturally to complete verification.</div>
          <div class="stage-badge hidden" id="stageText">0 of 2 complete.</div>
        </div>

        <div class="captcha-icon human" id="humanIcon">
          <div class="icon-chip">
            <svg viewBox="0 0 64 64" class="icon-svg" aria-hidden="true">
              <circle cx="32" cy="16" r="8" fill="#f8fafc"></circle>
              <rect x="24" y="26" width="16" height="18" rx="8" fill="#f8fafc"></rect>
              <rect x="18" y="28" width="6" height="16" rx="3" fill="#f8fafc"></rect>
              <rect x="40" y="28" width="6" height="16" rx="3" fill="#f8fafc"></rect>
              <rect x="26" y="44" width="5" height="14" rx="2.5" fill="#f8fafc"></rect>
              <rect x="33" y="44" width="5" height="14" rx="2.5" fill="#f8fafc"></rect>
            </svg>
          </div>
          <div class="icon-label">HUMAN</div>
        </div>
      </div>

      <div class="alert-box hidden" id="alertBox">
        <div class="alert-title">BOT DETECTED</div>
        <div class="alert-subtitle">Human timing required. Hold to restart.</div>
      </div>

      <div class="shape-wrap">
        <div class="shape-stage shape-bar" id="shapeStage">
          <div class="shape-fill" id="shapeFill"></div>
          <div class="shape-gloss"></div>
        </div>
      </div>

      <div class="progress-label" id="progressLabel">0%</div>

      <div class="button-row">
        <button class="fill-button" id="fillButton">Tap to Verify</button>
        <button class="continue-button hidden" id="continueButton">Continue</button>
        <button class="hold-button hidden" id="holdButton">Hold to Restart</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
